apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: go-controller-template-role
  labels:
    {{- include "go-controller-template.labels" . | nindent 4 }}
rules:
  {{- tpl (.Files.Get "controller-gen/clusterrole.yaml") . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: go-controller-template-rolebinding
  labels:
    {{- include "go-controller-template.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: go-controller-template-role
subjects:
  - kind: ServiceAccount
    name: {{ include "go-controller-template.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
