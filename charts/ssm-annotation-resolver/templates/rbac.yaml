apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ssm-annotation-resolver.fullname" . }}-role
  labels:
    {{- include "ssm-annotation-resolver.labels" . | nindent 4 }}
rules:
  {{- tpl (.Files.Get "controller-gen/clusterrole.yaml") . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ssm-annotation-resolver.fullname" . }}-rolebinding
  labels:
    {{- include "ssm-annotation-resolver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ssm-annotation-resolver.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "ssm-annotation-resolver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
