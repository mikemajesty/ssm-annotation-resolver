name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example v0.1.0)
        type: string
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Validate release ref
        run: |
          if [[ ! "${RELEASE_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_REF}"
            exit 1
          fi

          git fetch origin --tags

          if ! git rev-parse "${RELEASE_REF}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_REF} does not exist"
            exit 1
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: "ko: login"
        run: |
          make ko
          ./bin/ko login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} 

      - name: "helm: login"
        run: |
          make helm
          echo ${{ secrets.GITHUB_TOKEN }} | ./bin/helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build OCI and Push
        run: make push

      - name: Push Helm Chart as OCI artifact
        run: make chart
