name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      branch_from:
        description: Source branch for the tag
        type: string
        required: true
        default: main
      increment_type:
        description: Version increment type
        type: choice
        options:
          - patch
          - minor
          - major
        required: true
        default: patch

permissions:
  contents: write

jobs:
  create-release-tag:
    name: Create Release Tag
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.inputs.branch_from }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump Version, Commit, and Push Tag
        id: create_tag
        env:
          BRANCH_FROM: ${{ github.event.inputs.branch_from }}
          INCREMENT_TYPE: ${{ github.event.inputs.increment_type }}
        run: |
          if [[ ! -f package.json ]]; then
            echo "package.json not found at repository root"
            exit 1
          fi

          git fetch origin --tags
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          npm version "${INCREMENT_TYPE}" --no-git-tag-version
          NEXT_VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="v${NEXT_VERSION}"

          if git rev-parse "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists locally or on origin"
            exit 1
          fi

          if [[ "${CURRENT_VERSION}" == "${NEXT_VERSION}" ]]; then
            echo "Version did not change after increment"
            exit 1
          fi

          git add package.json
          git commit -m "chore(release): bump version to ${NEXT_VERSION}"
          git push origin "HEAD:${BRANCH_FROM}"

          TARGET_SHA="$(git rev-parse HEAD)"
          git tag -a "${TAG_NAME}" "${TARGET_SHA}" -m "Release ${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Workflow Summary
        env:
          TAG_NAME: ${{ steps.create_tag.outputs.tag_name }}
          TARGET_SHA: ${{ steps.create_tag.outputs.target_sha }}
          BRANCH_FROM: ${{ github.event.inputs.branch_from }}
          VERSION: ${{ steps.create_tag.outputs.version }}
          INCREMENT_TYPE: ${{ github.event.inputs.increment_type }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Tag created successfully

          | Property | Value |
          |---|---|
          | Tag | \`${TAG_NAME}\` |
          | Version | \`${VERSION}\` |
          | Branch | \`${BRANCH_FROM}\` |
          | Increment | \`${INCREMENT_TYPE}\` |
          | Commit | \`${TARGET_SHA}\` |

          This tag push should trigger the release workflow if it listens to \`v*\`.
          EOF
